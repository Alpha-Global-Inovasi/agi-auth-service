[workspace]
resolver = "3"
members = ["crates/agi-auth", "crates/agi-auth-actix"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["PT Alpha Global Inovasi"]
repository = "https://github.com/Alpha-Global-Inovasi/agi-auth-service"
homepage = "https://github.com/Alpha-Global-Inovasi/agi-auth-service"

[workspace.dependencies]
agi-auth = { path = "crates/agi-auth", version = "0.4.0", default-features = false }
actix-web = { version = "4", default-features = false, features = ["macros"] }
base64 = "0.22"
jsonwebtoken = "9"
reqwest = { version = "0.12.28", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
