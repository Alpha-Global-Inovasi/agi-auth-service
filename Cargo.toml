[workspace]
resolver = "3"
members = ["crates/agi-auth", "crates/agi-auth-actix"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["PT Alpha Global Inovasi"]
repository = "https://github.com/Alpha-Global-Inovasi/agi-auth-service"
homepage = "https://github.com/Alpha-Global-Inovasi/agi-auth-service"

[workspace.dependencies]
agi-auth = { path = "crates/agi-auth", version = "0.4.0", default-features = false }
actix-web = { version = "4.19", default-features = false, features = ["macros"] }
base64 = "0.23.1"
# aws-lc-rs is the crypto backend shared with reqwest's rustls; `use_pem` (default)
# is only needed by the tests that sign tokens from PEM keys.
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
