[package]
name = "rusted-auth-sea-orm"
description = "Postgres storage for rusted-auth with SeaORM: accounts, sessions, second factors, single-use tokens, attempt counters and the audit log"
readme = "README.md"
keywords = ["auth", "sea-orm", "postgres", "session", "storage"]
categories = ["authentication", "database"]
include = ["src/*.rs", "src/migration/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
version.workspace = true
edition.workspace = true
# SeaORM 2.0 needs Rust 1.94; the other crates keep the workspace minimum.
rust-version = "1.94"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["rustls-tls"]
# TLS backend of rusted-auth for fetching JWKS documents. This crate's own connection to
# Postgres takes its TLS backend from the application's `sea-orm` features.
rustls-tls = ["rusted-auth/rustls-tls"]
native-tls = ["rusted-auth/native-tls"]
# `MfaStore` for TOTP authenticators and recovery codes. The tables are created by the
# migration either way.
mfa = ["rusted-auth/mfa"]

[dependencies]
rusted-auth = { workspace = true, features = ["session"] }
chrono = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rusted-auth = { workspace = true, features = ["test-util", "mfa"] }
# One end-to-end path through the HTTP routes on this storage.
rusted-auth-actix = { path = "../rusted-auth-actix", version = "0.5.0", features = ["local"] }
actix-web = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
