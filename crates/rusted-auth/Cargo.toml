[package]
name = "rusted-auth"
description = "Framework-agnostic authentication core for Rust services: multi-issuer OIDC/JWT verification with JWKS caching and a Firebase preset"
readme = "README.md"
keywords = ["auth", "jwt", "oidc", "jwks", "firebase"]
categories = ["authentication", "web-programming"]
include = ["src/*.rs", "src/local/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["rustls-tls"]
# TLS backend for fetching discovery and JWKS documents. Enable exactly one.
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
# Local accounts: password hashing (argon2id), registration and login.
local = ["dep:argon2", "dep:unicode-normalization", "dep:uuid", "dep:zeroize"]
# Test helpers for `local`, such as a password hasher with cheap parameters.
# Never enable this in a production build.
test-util = ["local"]

[dependencies]
argon2 = { workspace = true, optional = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[package.metadata.docs.rs]
features = ["local"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }

[lints]
workspace = true
