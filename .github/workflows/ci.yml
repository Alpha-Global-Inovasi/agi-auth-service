name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # rusted-auth-sea-orm's tests turn on rusted-auth features (`test-util`, `mfa`)
      # through its dev-dependencies, so leave it out of the default-feature runs.
      - run: cargo clippy --workspace --exclude rusted-auth-sea-orm --all-targets
      - run: cargo test --workspace --exclude rusted-auth-sea-orm
      - run: cargo doc --workspace --no-deps
      # Optional features (such as `local`) are off by default, so check them as well.
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features

  features:
    name: native-tls backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude rusted-auth-sea-orm --no-default-features --features native-tls

  postgres:
    name: Postgres storage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSTED_AUTH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Fail instead of skipping when the URL above goes missing.
      RUSTED_AUTH_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rusted-auth-sea-orm
      - run: cargo test -p rusted-auth-sea-orm --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # rusted-auth-sea-orm needs a newer Rust (SeaORM 2.0); it is checked below.
      - run: cargo check --workspace --exclude rusted-auth-sea-orm --all-targets
      - run: cargo check --workspace --exclude rusted-auth-sea-orm --all-targets --all-features

  msrv-sea-orm:
    name: MSRV (rusted-auth-sea-orm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the crate's Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' crates/rusted-auth-sea-orm/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rusted-auth-sea-orm --all-targets
      - run: cargo check -p rusted-auth-sea-orm --all-targets --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Private test keys must not be packaged
        run: |
          for crate in rusted-auth rusted-auth-actix rusted-auth-sea-orm; do
            if cargo package -p "$crate" --list --allow-dirty | grep -Ei 'testdata|\.pem$'; then
              echo "::error::$crate would publish test fixtures"
              exit 1
            fi
          done
